\* NEG-WR3: cancel returns the lease but leaves waiter_delivery_present_
\* set — the one-line L1 arbitration break. Named target: the C2c
\* single-authority law. (Double PUBLICATION is additionally blocked by L2
\* and L3; see the README layering analysis — that is the finding, not a
\* missing gate.)
SPECIFICATION Spec
INVARIANTS
    InvSingleAuthority
CONSTANTS
    Waiters = {W0, W1}
    W0 = W0
    W1 = W1
    CheckGeneration = TRUE
    CancelClearsDelivery = FALSE
    DeliveredPinBlocksReuse = TRUE
