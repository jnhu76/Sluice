\* NEG-RA-2: cancel resolves the slot but ignores the generation; a stale
\* key terminalizes the current not-yet-accepted occupant. The stale key is
\* CAUSAL: it was issued (committed[sg]) and released (freed[sg]) in an
\* earlier generation, and the slot has since been reused (the W4 chain).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT InvTerminalRequiresAccepted

CONSTANTS
MaxGen = 2
FAULT = "StaleCancel"
