\* M4 as-built, liveness gate. Property-SPECIFIC: the cfg lists ONLY
\* DrainEventuallyReturns (the #161 join hang — the run never returns), so
\* a TLC temporal-violation verdict names exactly that property (TLC does
\* not name the violated property in its output; a single-property cfg is
\* the mechanical way to pin the gate). Expected: CEX DrainEventuallyReturns.
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {W0, W1}
    Fibers = {WF, R1, R2}
    W0 = W0
    W1 = W1
    WF = WF
    R1 = R1
    R2 = R2
    NOFIBER = NOFIBER
    RepairContributionGeneration = FALSE
    BumpPopErase = TRUE
    BumpMwS1Erase = TRUE
    BumpRecheckErase = TRUE
    BumpPubErase = TRUE
    BumpDanceResetErase = TRUE
    M1NoPubSignal = FALSE
    M2NoTransport = FALSE
    M3NoCommitRecheck = FALSE
    M5GrantNoTicket = FALSE

SPECIFICATION Spec

PROPERTY
    DrainEventuallyReturns
