\* Split-window SAFETY gate on the SAME constants as the reachability
\* witness (E12SchedLivenessSplitWindow.cfg — all five bumps on, the split
\* EraseIdle/BumpGen pairs live). The witness proves the exchange(0)-
\* before-bump window is REACHABLE; this gate proves it costs only a
\* TRANSIENT park: a stale contributor may arm a baseline in the window,
\* but DrainStuckState still holds (the eraser's bump, run, and re-dance
\* not-last signal are sequenced after the arming; the cv predicate
\* returns the dancer to the loop). This is the over-strong exploration
\* configuration; the authoritative as-built repaired safety gate is
\* E12SchedLivenessSafety.cfg.
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {W0, W1}
    Fibers = {WF, R1, R2}
    W0 = W0
    W1 = W1
    WF = WF
    R1 = R1
    R2 = R2
    NOFIBER = NOFIBER
    RepairContributionGeneration = TRUE
    BumpPopErase = TRUE
    BumpMwS1Erase = TRUE
    BumpRecheckErase = TRUE
    BumpPubErase = TRUE
    BumpDanceResetErase = TRUE
    M1NoPubSignal = FALSE
    M2NoTransport = FALSE
    M3NoCommitRecheck = FALSE
    M5GrantNoTicket = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    DrainStuckState
    NoReaderWriterOverlap
    TerminalUniqueness
    PublicationUniqueness
    NoLinkedTerminal
    InboxImpliesTicket
    NoStrandedRunnable
