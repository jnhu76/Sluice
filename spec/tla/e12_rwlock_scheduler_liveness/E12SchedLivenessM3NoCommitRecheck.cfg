    Fibers = {WF, R1, R2}
    W0 = W0
    W1 = W1
    WF = WF
    R1 = R1
    R2 = R2
    NOFIBER = NOFIBER
    RepairContributionGeneration = TRUE
    BumpPopErase = TRUE
    BumpMwS1Erase = TRUE
    BumpRecheckErase = TRUE
    BumpPubErase = TRUE
    BumpDanceResetErase = TRUE
