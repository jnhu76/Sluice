\* #191 non-vacuity witness (2/2): the last-alive participant exit branch --
\* the participant is the last alive worker, so its exit classifies the run
\* ReturnedStalled (never ReturnedQuiescent, because a participant exit is
\* beside outstanding backend work or bridge obligation, not quiescence).
\* Expected result: VIOLATED. This final shape is reachable ONLY through the
\* last-alive branch of ParticipantNoProgressExit (the RetireWorkerQuiescent
\* path classifies ReturnedQuiescent or ReturnedStalled on a different guard;
\* ReturnStalled does not retire a worker). The ghost
\* participantExitEndedRun pins this specific terminal classification.
SPECIFICATION Spec
INVARIANTS
    NoReachPnpExitEndedRun

CONSTANTS
    Workers = {W0, W1}
    Fibers = {F0}
    W0 = W0
    W1 = W1
    F0 = F0
    NONE = NONE
    SplitWait = TRUE
