\* NEG-CT4 specificity: the drop-pending-check mutant must PASS the unrelated
\* laws. Excluded: InvNoDeliveryWhenIdle (the named target) only - an idle
\* delivery still uses the CURRENT epoch, which was a real created request
\* (epoch 0 can never be delivered: acked starts at 0), so the provenance,
\* single-shot, protection, clear, starve and ack-representation laws hold.
SPECIFICATION Spec
INVARIANTS
    InvSingleShotPerEpoch
    InvProtectionBlocksDelivery
    InvClearRemovesIntent
    InvNoStaleAckStarvesDelivery
    InvDeliveredWasRequested
    InvAckIsRealEpoch
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = FALSE
    ProtectionBlocks = TRUE
