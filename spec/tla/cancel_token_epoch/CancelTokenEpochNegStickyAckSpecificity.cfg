\* NEG-CT1 specificity: the same sticky-ack mutant must PASS the unrelated
\* laws. Excluded (documented co-victims, entailed by the SAME root defect):
\*   InvAckIsRealEpoch            - the named target
\*   InvNoStaleAckStarvesDelivery - the sticky ack starves delivery of any
\*                                  later request (the observable consequence
\*                                  of the same root defect; a consumer that
\*                                  already ran its cancel point under the
\*                                  current pending request cannot deliver it)
SPECIFICATION Spec
INVARIANTS
    InvSingleShotPerEpoch
    InvNoDeliveryWhenIdle
    InvProtectionBlocksDelivery
    InvClearRemovesIntent
    InvDeliveredWasRequested
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = FALSE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
