\* Protection witness: a request observed by a blocked cancel point later
\* delivered after unblocking (protection blocks delivery, not the request).
SPECIFICATION Spec
INVARIANTS
    NoReachProtectedRequestDelivered
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsEpochRelative = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
