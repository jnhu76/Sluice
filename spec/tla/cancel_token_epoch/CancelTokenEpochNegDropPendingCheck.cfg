\* NEG-CT4: the pending gate is dropped - check_cancel delivers even when no
\* request is pending (a ghost delivery with no request to cause it).
SPECIFICATION Spec
INVARIANTS
    InvNoDeliveryWhenIdle
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = FALSE
    ProtectionBlocks = TRUE
