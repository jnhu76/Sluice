\* Shared-token witness (Group semantics): one request delivered to BOTH
\* consumers - per-consumer acknowledgement is real.
SPECIFICATION Spec
INVARIANTS
    NoReachSharedDelivered
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
