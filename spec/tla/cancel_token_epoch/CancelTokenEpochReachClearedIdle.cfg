\* CR6 reachability witness: clean reuse start - after clear() the token is
\* genuinely idle (pending=0) before the next request.
SPECIFICATION Spec
INVARIANTS
    NoReachClearedIdle
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsEpochRelative = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
