\* NEG-CT3: the single-shot ack gate is dropped - every unblocked cancel
\* point delivers while a request is pending (no epoch discrimination),
\* so one consumer delivers the SAME request epoch repeatedly.
SPECIFICATION Spec
INVARIANTS
    InvSingleShotPerEpoch
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = FALSE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
