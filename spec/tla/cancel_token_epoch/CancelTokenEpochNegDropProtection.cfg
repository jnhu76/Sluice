\* NEG-CT5: the protection gate is dropped - a blocked (protected) consumer
\* still delivers, breaking CancelProtection's blocks-delivery-not-request
\* contract (Zig Io.zig:1322, ADR §2.2).
SPECIFICATION Spec
INVARIANTS
    InvProtectionBlocksDelivery
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = FALSE
