\* NEG-CT2 specificity: the clear-keeps-pending mutant must PASS the
\* unrelated laws. Excluded: InvClearRemovesIntent (the named target) only -
\* no other law is entailed (the stale delivery still occurs with pending=1,
\* so the provenance, single-shot, protection, ack and starve laws hold).
SPECIFICATION Spec
INVARIANTS
    InvSingleShotPerEpoch
    InvNoDeliveryWhenIdle
    InvProtectionBlocksDelivery
    InvNoStaleAckStarvesDelivery
    InvDeliveredWasRequested
    InvAckIsRealEpoch
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = FALSE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
