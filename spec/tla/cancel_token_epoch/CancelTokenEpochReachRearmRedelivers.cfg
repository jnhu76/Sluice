\* Rearm witness (Zig Io.recancel): a consumer that already delivered a
\* request delivers once more after rearm() - the request stays pending and
\* its epoch advances.
SPECIFICATION Spec
INVARIANTS
    NoReachRearmRedelivers
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsEpochRelative = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
