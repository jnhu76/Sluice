\* NEG-CT5 specificity: the drop-protection mutant must PASS the unrelated
\* laws. Excluded: InvProtectionBlocksDelivery (the named target) only - a
\* blocked delivery still records a real pending epoch under the intact
\* single-shot gate, so provenance, single-shot, clear, starve and
\* ack-representation all hold.
SPECIFICATION Spec
INVARIANTS
    InvSingleShotPerEpoch
    InvNoDeliveryWhenIdle
    InvClearRemovesIntent
    InvNoStaleAckStarvesDelivery
    InvDeliveredWasRequested
    InvAckIsRealEpoch
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = FALSE
