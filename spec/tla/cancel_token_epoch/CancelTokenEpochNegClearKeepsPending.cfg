\* NEG-CT2: clear() keeps the pending bit - the "cancel intent survives
\* reuse" defect (HC3). After a clear the old request still delivers to the
\* next cancel point of a consumer in the post-reuse phase.
SPECIFICATION Spec
INVARIANTS
    InvClearRemovesIntent
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = FALSE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
