\* CR3 reachability witness: token reuse - a consumer acked a request, then
\* clear()+request() opened a NEW request generation (epoch >= 2) while
\* pending.
SPECIFICATION Spec
INVARIANTS
    NoReachReuse
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsSticky = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
