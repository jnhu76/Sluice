\* CR5 reachability witness: the ADR fix is non-vacuous - the previously-acked
\* consumer delivered the NEW (>= 2) request after clear()+request() (token
\* reuse for real).
SPECIFICATION Spec
INVARIANTS
    NoReachNewRequestDelivered
CONSTANTS
    Consumers = {A, B}
    A = A
    B = B
    AckIsEpochRelative = TRUE
    ClearClearsPending = TRUE
    SingleShot = TRUE
    CheckPending = TRUE
    ProtectionBlocks = TRUE
