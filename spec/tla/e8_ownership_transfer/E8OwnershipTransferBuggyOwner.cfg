SPECIFICATION Spec
\* The named target is listed FIRST so TLC reports the named violation the
\* verifier asserts (audit 2026-08-18); the aggregate Inv follows and would
\* otherwise mask the specific law.
INVARIANTS
    InvLocalMatchesOwner
    Inv
    InvInboxMatchesOwner
    InvTicketImpliesRunnable

CONSTANTS
    Fibers = {F0, F1}
    Workers = {W0, W1}
    W0 = W0
    W1 = W1
    F0 = F0
    F1 = F1
    NA = NA
