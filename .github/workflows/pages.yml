name: Deploy Sluice architecture page

on:
  push:
    branches:
      - master
    paths:
      - 'visuals/sluice-v1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Reconstruct static page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode visuals/sluice-v1/index.html.gz.b64 | gzip -dc > _site/index.html
          test -s _site/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
