name: CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "xmake.lua"
      - "xmake/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
    paths:
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "xmake.lua"
      - "xmake/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux ${{ matrix.mode }} build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The official Xmake action owns only tool setup and Xmake's content-addressed
      # build cache. Do not cache the project build directory or .xmake state: those
      # contain configuration state whose lifetime is broader than a compiler result.
      # Debug and release use separate cache identities because compiler flags differ.
      - name: Set up Xmake with build cache
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"
          build-cache: true
          project-path: "."
          build-cache-key: "linux-${{ matrix.mode }}"

      - name: Configure ${{ matrix.mode }} build
        run: xmake f -m ${{ matrix.mode }} -y

      - name: Build
        run: xmake -y

      - name: Test current targets
        run: xmake test -v
