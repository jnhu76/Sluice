name: CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - "xmake.lua"
      - "xmake/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
    paths:
      - "include/**"
      - "src/**"
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - "xmake.lua"
      - "xmake/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-comment-authority:
    name: C++ comment authority guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scanner self-tests
        run: python3 scripts/test_check_cpp_comment_authority.py

      - name: Scan C++ comments
        run: python3 scripts/check_cpp_comment_authority.py .

  package-verifier-selftests:
    name: Package verifier surface self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Package verifier surface discriminators
        run: python3 scripts/test_verify_v2_package.py

  linux-build:
    name: Linux ${{ matrix.mode }} build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        mode: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The official Xmake action owns only tool setup and Xmake's content-addressed
      # build cache. Do not cache the project build directory or .xmake state: those
      # contain configuration state whose lifetime is broader than a compiler result.
      # Debug and release use separate cache identities because compiler flags differ.
      - name: Set up Xmake with build cache
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"
          build-cache: true
          project-path: "."
          build-cache-key: "linux-${{ matrix.mode }}"

      - name: Configure ${{ matrix.mode }} build
        run: xmake f -m ${{ matrix.mode }} -y

      - name: Build
        run: xmake -y

      - name: Test current targets
        run: xmake test -v

  # Targeted regression gate for the dynamic-ASan LD_PRELOAD ordering class:
  # the tail CLI oracle spawns the real sluice-tail with the test-only pread
  # shim preloaded, which only passes when the ASan runtime is ordered ahead
  # of the shim. Single-test scope keeps the gate cheap and avoids making an
  # unrelated ASan failure anywhere else block every PR.
  linux-asan-tail-oracle:
    name: Linux asan tail CLI oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Xmake with build cache
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"
          build-cache: true
          project-path: "."
          build-cache-key: "linux-asan-tail-oracle"

      - name: Configure asan build
        run: xmake f -m asan -y

      - name: Build tail CLI oracle
        run: xmake build -y app_tail_cli_oracle_test

      - name: Run tail CLI oracle under asan
        run: xmake test -y "app_tail_cli_oracle_test/*"
