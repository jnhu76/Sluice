# Repository-level pull-request CI.
#
# Policy:
#   - Linux Clang Debug is the primary correctness/governance gate.
#   - Linux Clang Release proves the optimized production build + runtime suite.
#   - Sanitizers, long stress loops, and the heavyweight Phase C1 aggregate
#     backend-conformance runner stay as explicit developer/nightly evidence;
#     they are intentionally not paid on every PR.
#
# The fast deterministic repository validators are delegated to the same
# scripts/gates/pre-push.sh entry point developers run locally. This avoids
# repeating the individual Python validators in YAML while keeping CI
# authoritative for those checks.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-clang-debug:
    name: Linux Clang Debug
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # mechanical-facts.py validates historical pinned-SHA claims, so the
          # Debug governance gate needs the full object history.
          fetch-depth: 0

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (Clang, debug)
        run: xmake f -m debug --toolchain=clang -y

      - name: Build production libraries
        run: |
          xmake build sluice_core
          xmake build sluice_async

      - name: Build test targets
        run: xmake build -g test

      - name: Run tests (bounded hang watchdog)
        # Debug keeps the forensic path: a rare hosted-runner hang should fail
        # closed and leave an actionable all-thread trace instead of a timeout.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          bash scripts/ci-hang-watchdog.sh 420 xmake test -v -j 4

      - name: Structural API authority gates
        # These are cheap compile-time invariants and remain merge-enforced.
        # They catch accidental re-exposure of private/deleted authority that
        # ordinary runtime tests cannot prove structurally.
        env:
          CXX: clang++
        run: |
          bash scripts/verify-async-api-negative-compile.sh
          bash scripts/verify-async-identity-negative-compile.sh
          bash scripts/verify-completion-authority-negative-compile.sh
          bash scripts/verify-request-arena-negative-compile.sh
          bash scripts/verify-request-handle-authority-negative-compile.sh
          bash scripts/verify-external-backend-authority-negative-compile.sh

      - name: Public acceptance consumers
        # Build + execute consumers against the public production surface.
        run: |
          xmake build public_api_acceptance
          xmake run public_api_acceptance
          xmake build async_foundation_quickstart
          xmake run async_foundation_quickstart

      - name: Repository mechanical gates
        # One fast entry point for doc links, architecture structure,
        # backend-conformance manifest attribution self-test, mechanical facts,
        # and git diff --check. This replaces the duplicated Python invocations
        # that previously appeared as several CI steps.
        run: bash scripts/gates/pre-push.sh </dev/null

  linux-clang-release:
    name: Linux Clang Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Release does not run historical/doc governance, so the default
        # shallow checkout is sufficient and avoids unnecessary transfer.

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (Clang, release)
        run: xmake f -m release --toolchain=clang -y

      - name: Build optimized production + tests
        # Keep this job intentionally narrow: optimized codegen/linking plus
        # the real runtime suite. No Python governance, negative-compile probes,
        # sanitizers, documentation scans, or package installation.
        run: |
          xmake build sluice_core
          xmake build sluice_async
          xmake build -g test

      - name: Run optimized tests
        # Release only needs a hard fail-closed budget, not Debug's expensive
        # gdb forensic path. GNU timeout keeps this step dependency-free and
        # kills a stuck test process group after a short grace period.
        run: timeout --signal=TERM --kill-after=10s 300s xmake test -v -j 4

      - name: Release public smoke
        # Small production-surface smoke after the full optimized test suite.
        run: |
          xmake build public_api_acceptance
          xmake run public_api_acceptance
          xmake build async_foundation_quickstart
          xmake run async_foundation_quickstart
