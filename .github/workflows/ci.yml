# Repository-level CI gate.
#
# Generic by design: it knows nothing about E13, P7, Select or any specific
# test name. It drives the project's unified build/test entry points
# (xmake.lua test group) so adding a future Queue/Channel/Socket test only
# touches xmake.lua, never this workflow.
#
# Scope of the first version: a single required job — Linux Clang Debug.
# No OS/compiler matrix, no sanitizers, no long stability loops, no TLA+.
# Sanitizer/stability evidence stays in local/nightly runs; this is the PR
# merge gate.
#
# Trigger policy (per project decision): runs on pull_request only, plus
# manual workflow_dispatch. It does NOT run on pushes to master. The
# required status check that guards a merge is therefore the pull_request
# run on the PR head.
#
# Decisions verified against Context7 (GitHub Actions + xmake-docs) and the
# setup-xmake action README; see PR description for the doc citations.
name: ci

on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR/ref so an older CI run does not
# block or waste runners when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: the gate only needs to read the repo contents.
permissions:
  contents: read

jobs:
  linux-clang-debug:
    name: Linux Clang Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          # Pin to a known-good release line. 'latest' resolves to the newest
          # stable xmake at run time; the build is not sensitive to a patch
          # version, and pinning avoids drift without freezing on one build.
          xmake-version: latest

      - name: Configure (Clang, debug)
        # -y answers config prompts non-interactively in CI.
        run: xmake f -m debug --toolchain=clang -y

      - name: Build production libraries
        # Build the real production targets explicitly. Some tests link the
        # internal-testing variant; building the production libs alone does
        # not prove the production surface (warning-as-error, Clang
        # thread-safety analysis, normal linking) still compiles.
        run: |
          xmake build sluice_core
          xmake build sluice_async

      - name: Build test targets
        # Builds every target in the unified 'test' group (xmake.lua).
        run: xmake build -g test

      - name: Run tests
        # xmake test returns non-zero if any test fails (suitable for CI).
        # -v keeps the per-test output visible in the Actions log.
        run: xmake test -v

      - name: Negative-compile verification (E15-P2-03)
        # Verifies that every deleted/private API guard on the E10-E12 async
        # synchronization primitives compiles-away (not just missing headers).
        run: bash scripts/verify-async-api-negative-compile.sh

      - name: Identity-authority negative-compile (E16-C2-T4)
        # Verifies that the Fiber-local Runtime execution-identity WRITE path
        # (Fiber::set_execution_tag, Scheduler::set_current_fiber_execution_tag)
        # is unreachable from ordinary (non-friend) application code — a
        # STRUCTURAL authority proof at the installed-header level. Previously
        # this script existed but was not wired into CI, so the claim "public
        # setter authority enforced by a negative-compile gate" was not actually
        # exercised by the merge gate.
        run: bash scripts/verify-async-identity-negative-compile.sh

      - name: Completion-authority negative-compile (P0-03)
        # ADR-explicit-io-completion-authority — proves the publication
        # mutators (try_claim_for_backend, publish_from_reap,
        # rollback_claim_before_accept, reap_seq) are structurally unreachable
        # from ordinary application code. This is the merge-gate evidence that
        # P0-03 stays resolved: without it, a future commit could silently
        # re-expose the mutators and still merge.
        # CXX is pinned to clang++ to match the required Linux Clang Debug gate.
        env:
          CXX: clang++
        run: bash scripts/verify-completion-authority-negative-compile.sh

      - name: RequestArena slot-authority negative-compile (Phase B)
        # ADR-explicit-io-request-contract (Phase B) — proves the RequestSlot
        # lifecycle fields (state, generation, enqueue pin, terminal result,
        # waiter registration, publication binding) are structurally
        # unreachable from ordinary application code: every transition is owned
        # by RequestArena under the leaf slot-lifecycle mutex. Previously this
        # script existed but was not wired into CI, so the slot-authority claim
        # was not actually exercised by the merge gate.
        # CXX is pinned to clang++ to match the required Linux Clang Debug gate.
        env:
          CXX: clang++
        run: bash scripts/verify-request-arena-negative-compile.sh

      - name: Build and run acceptance consumers
        # Proves the public async-foundation surface is usable from consumers
        # that see only the installed public headers. Build AND execute: a
        # runtime behavioral regression must fail CI, not merely a compile error.
        run: |
          xmake build public_api_acceptance
          xmake run public_api_acceptance
          xmake build async_foundation_quickstart
          xmake run async_foundation_quickstart

      - name: Documentation verification
        # Link checker. Validates ONLY git-tracked Markdown (via `git ls-files`)
        # so generated/gitignored files under docs/ never enter the scan set —
        # this is what makes the gate safe to enforce in CI where local build
        # artifacts could otherwise leak in.
        #  1. --self-test: negative tests that the checker actually catches
        #     broken/stale links and excludes untracked files.
        #  2. full scan: every tracked doc link must resolve.
        #  3. architecture docs: structural completeness of governance files
        #     (constitution IDs, divergence registry fields, PR template refs).
        run: |
          python3 scripts/check-doc-links.py --self-test
          python3 scripts/check-doc-links.py
          python3 scripts/verify-architecture-docs.py

      - name: Hardening runner unit tests
        # Pure Python unit tests for the hardening runner.  These do not
        # require xmake or a C++ build; they validate runner logic
        # (heartbeat scheduling, failure detail parsing, reporting,
        # timeout escalation, verdict calculation, etc.) independently.
        run: python3 -m unittest discover -v scripts/tests
