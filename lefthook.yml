# Lefthook configuration for Sluice.
#
# Deliberately minimal: Lefthook is only the Git-hook dispatcher. The actual
# quality-gate logic lives in scripts/gates/pre-push.sh so it can be invoked
# the same way manually, in CI, or via the hook — there is one authority for
# what the pre-push gate checks.
#
# Scope policy (see AGENTS.md): the local pre-push gate catches deterministic
# mechanical failures (docs, manifests, generated-file consistency, whitespace)
# BEFORE a push consumes a CI round trip. It intentionally does NOT run the
# build, full test suite, sanitizers, real-liburing, or formal models — those
# remain CI / explicit developer gates. GitHub CI stays authoritative; this
# hook only shortens feedback, it never replaces CI.
#
# A checkout does NOT auto-install hooks just because this file exists.
# Each developer must run once per clone:
#
#     lefthook install
#
# Emergency bypass (NOT normal workflow):
#
#     git push --no-verify

pre-push:
  jobs:
    - name: sluice-pre-push
      # Bash is invoked explicitly so the hook works on checkouts where the
      # script lacks the executable bit or where GIT_DIR mangles PATH.
      run: bash scripts/gates/pre-push.sh
