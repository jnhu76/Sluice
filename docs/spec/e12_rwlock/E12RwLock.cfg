\* TLC configuration for E12RwLock (E12-F AsyncRwLock safety model).
\* Run: java -cp tla2tools.jar tlc2.TLC -config E12RwLock.cfg E12RwLock.tla
CHECK_DEADLOCK FALSE

CONSTANTS
    Epochs = {E1, E2, E3}
    E1 = E1
    E2 = E2
    E3 = E3

SPECIFICATION Spec

INVARIANTS
    MutualExclusion
    NoReaderWriterOverlap
    NoReaderBarging
    ReaderBatchCorrectness
    TerminalUniqueness
    PublicationUniqueness
    NoLinkedTerminal
    ActiveReaderIntegrity
    QueueNoDuplicates
    WriterOwnerConsistency
