<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sluice Architecture</title>
  <desc id="desc">Architecture overview of Sluice, a C++20 explicit I/O library/runtime.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.accent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.small{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.dash{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:8 6}.title{font:700 44px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.subtitle{font:500 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}.h{font:700 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.m{font:600 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.b{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.s{font:400 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}.blue{stroke:#2563eb;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#2563eb}.doctrine{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <text x="690" y="60" text-anchor="middle" class="title">Sluice Architecture</text>
  <text x="690" y="92" text-anchor="middle" class="subtitle">Explicit I/O library/runtime</text>

  <rect x="80" y="125" rx="14" ry="14" width="1220" height="105" class="panel"/>
  <text x="690" y="158" text-anchor="middle" class="h">Applications</text>
  <rect x="110" y="172" rx="10" ry="10" width="270" height="42" class="small"/><text x="245" y="199" text-anchor="middle" class="m">sluice-copy</text>
  <rect x="400" y="172" rx="10" ry="10" width="270" height="42" class="small"/><text x="535" y="199" text-anchor="middle" class="m">sluice-hash</text>
  <rect x="690" y="172" rx="10" ry="10" width="270" height="42" class="small"/><text x="825" y="199" text-anchor="middle" class="m">sluice-grep</text>
  <rect x="980" y="172" rx="10" ry="10" width="290" height="42" class="small"/><text x="1125" y="199" text-anchor="middle" class="m">sluice-tail</text>

  <path d="M690 230 L690 258" class="blue" marker-end="url(#arrow)"/>
  <rect x="80" y="270" rx="14" ry="14" width="1220" height="100" class="accent"/>
  <text x="690" y="303" text-anchor="middle" class="h">Public Semantic Boundary</text>
  <rect x="110" y="318" rx="9" ry="9" width="210" height="36" class="small"/><text x="215" y="342" text-anchor="middle" class="b">explicit operations</text>
  <rect x="340" y="318" rx="9" ry="9" width="170" height="36" class="small"/><text x="425" y="342" text-anchor="middle" class="b">completion</text>
  <rect x="530" y="318" rx="9" ry="9" width="170" height="36" class="small"/><text x="615" y="342" text-anchor="middle" class="b">cancellation</text>
  <rect x="720" y="318" rx="9" ry="9" width="170" height="36" class="small"/><text x="805" y="342" text-anchor="middle" class="b">durability</text>
  <rect x="910" y="318" rx="9" ry="9" width="220" height="36" class="small"/><text x="1020" y="342" text-anchor="middle" class="b">resource bounds</text>
  <rect x="1150" y="318" rx="9" ry="9" width="120" height="36" class="small"/><text x="1210" y="342" text-anchor="middle" class="b">identity</text>

  <path d="M450 370 L450 397" class="blue" marker-end="url(#arrow)"/>
  <path d="M940 370 L940 397" class="blue" marker-end="url(#arrow)"/>

  <rect x="80" y="410" rx="14" ry="14" width="575" height="190" class="panel"/>
  <text x="367" y="448" text-anchor="middle" class="h">Synchronous I/O Core</text>
  <circle cx="115" cy="482" r="5" class="dot"/><text x="135" y="488" class="b">Result&lt;T&gt; / IoError</text>
  <circle cx="115" cy="515" r="5" class="dot"/><text x="135" y="521" class="b">Reader / Writer</text>
  <circle cx="115" cy="548" r="5" class="dot"/><text x="135" y="554" class="b">File &amp; positional I/O</text>
  <circle cx="390" cy="482" r="5" class="dot"/><text x="410" y="488" class="b">Copy / durability</text>
  <circle cx="390" cy="515" r="5" class="dot"/><text x="410" y="521" class="b">WAL / helpers</text>
  <circle cx="390" cy="548" r="5" class="dot"/><text x="410" y="554" class="b">Blocking I/O pool</text>

  <rect x="685" y="410" rx="14" ry="14" width="615" height="190" class="panel"/>
  <text x="992" y="448" text-anchor="middle" class="h">Asynchronous Runtime</text>
  <circle cx="720" cy="482" r="5" class="dot"/><text x="740" y="488" class="b">Async I/O context</text>
  <circle cx="720" cy="515" r="5" class="dot"/><text x="740" y="521" class="b">Completion &amp; RequestHandle</text>
  <circle cx="720" cy="548" r="5" class="dot"/><text x="740" y="554" class="b">Scheduler / Fiber / Runtime</text>
  <circle cx="1020" cy="482" r="5" class="dot"/><text x="1040" y="488" class="b">Group / Batch / Future</text>
  <circle cx="1020" cy="515" r="5" class="dot"/><text x="1040" y="521" class="b">Cancellation</text>
  <circle cx="1020" cy="548" r="5" class="dot"/><text x="1040" y="554" class="b">Synchronization primitives</text>

  <path d="M367 600 L367 628 L690 628" class="blue" marker-end="url(#arrow)"/>
  <path d="M992 600 L992 628 L690 628" class="blue" marker-end="url(#arrow)"/>

  <rect x="80" y="640" rx="14" ry="14" width="1220" height="95" class="panel"/>
  <text x="690" y="674" text-anchor="middle" class="h">Correctness Kernel</text>
  <rect x="120" y="690" rx="9" ry="9" width="190" height="30" class="small"/><text x="215" y="711" text-anchor="middle" class="b">ownership</text>
  <rect x="330" y="690" rx="9" ry="9" width="190" height="30" class="small"/><text x="425" y="711" text-anchor="middle" class="b">lifecycle</text>
  <rect x="540" y="690" rx="9" ry="9" width="220" height="30" class="small"/><text x="650" y="711" text-anchor="middle" class="b">terminal winner</text>
  <rect x="780" y="690" rx="9" ry="9" width="190" height="30" class="small"/><text x="875" y="711" text-anchor="middle" class="b">publication</text>
  <rect x="990" y="690" rx="9" ry="9" width="190" height="30" class="small"/><text x="1085" y="711" text-anchor="middle" class="b">release</text>

  <path d="M690 735 L690 758" class="blue" marker-end="url(#arrow)"/>
  <rect x="80" y="770" rx="14" ry="14" width="1220" height="75" class="panel"/>
  <text x="690" y="800" text-anchor="middle" class="h">Execution Mechanisms</text>
  <rect x="395" y="811" rx="8" ry="8" width="250" height="24" class="small"/><text x="520" y="828" text-anchor="middle" class="s">ThreadPoolBackend</text>
  <rect x="685" y="811" rx="8" ry="8" width="300" height="24" class="dash"/><text x="835" y="828" text-anchor="middle" class="s">UringBackend (optional)</text>

  <rect x="1330" y="125" rx="14" ry="14" width="240" height="720" class="panel"/>
  <text x="1450" y="160" text-anchor="middle" class="h">Design doctrine</text>
  <rect x="1350" y="190" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="221" text-anchor="middle" class="m">Minimal semantics</text><text x="1450" y="245" text-anchor="middle" class="s">Expose only what callers need.</text>
  <rect x="1350" y="286" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="317" text-anchor="middle" class="m">Clear boundaries</text><text x="1450" y="341" text-anchor="middle" class="s">No accidental layer leaks.</text>
  <rect x="1350" y="382" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="413" text-anchor="middle" class="m">Explicit authority</text><text x="1450" y="437" text-anchor="middle" class="s">One clear owner per invariant.</text>
  <rect x="1350" y="478" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="509" text-anchor="middle" class="m">Named bounds</text><text x="1450" y="533" text-anchor="middle" class="s">Make limits explicit.</text>
  <rect x="1350" y="574" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="605" text-anchor="middle" class="m">Replaceable execution</text><text x="1450" y="629" text-anchor="middle" class="s">Mechanisms do not define semantics.</text>
  <rect x="1350" y="670" rx="12" ry="12" width="200" height="80" class="doctrine"/><text x="1450" y="701" text-anchor="middle" class="m">Minimum mechanism</text><text x="1450" y="725" text-anchor="middle" class="s">Every layer must earn its cost.</text>

  <text x="690" y="875" text-anchor="middle" class="s">Code and build define current behavior. This diagram summarizes the current architecture.</text>
</svg>