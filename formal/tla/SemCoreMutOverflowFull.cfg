\* Mutant OVERFLOW_FULL: a release refused at the ceiling overflows --
\* available++ with granted++ (permit accounting stays balanced) and the
\* result stays false with effect_kind = refused.  Only the ceiling is
\* broken: TypeOK or InvCapacity MUST fail, InvReleaseResult must hold.
CONSTANT Initial = 0
CONSTANT Max = 1
CONSTANT MaxHistory = 6
CONSTANT MutCreatePermit = FALSE
CONSTANT MutLosePermit = FALSE
CONSTANT MutDoubleConsume = FALSE
CONSTANT MutFifoBypass = FALSE
CONSTANT MutOverflowFull = TRUE
CONSTANT MutWrongFullResult = FALSE
CONSTANT MutWrongGrantResult = FALSE
CONSTANT MutFusedReturn = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT InvCapacity
INVARIANT InvPermitPool
INVARIANT InvTakeBound
INVARIANT InvQueueNoDup
INVARIANT InvQueueOwnership
INVARIANT InvFifo
INVARIANT InvCompDiscipline
INVARIANT InvReleaseResult
