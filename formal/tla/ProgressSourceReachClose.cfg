\* C2-E re-closure (Issue #397), re-anchored to the #444 production
\* semantics: a close_admission() call on an already-closed admission is
\* a stuttering step (no signal, no epoch move), so normal repeated close
\* cannot pump the progress generation toward the absorbing pair. The
\* same domain sizes as the Safety run (5 bumps would freeze the pair;
\* at most 4 resource-consuming bumps exist without the pump) must now
\* hold
\* InvNoProgressTerminal CLEANLY. The paired mutant run
\* MutRepeatCloseSignals must VIOLATE it.
